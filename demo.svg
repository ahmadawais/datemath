<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sopGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9EFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B362FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB94FF;stop-opacity:1" />
    </linearGradient>
    <style>
      .terminal-bg { fill: #1E1E3F; }
      .terminal-text { fill: #FAF9F6; font-family: monospace; font-size: 13px; }
      .terminal-prompt { fill: #B362FF; font-weight: bold; font-family: monospace; }
      .terminal-output { fill: #A599E9; font-family: monospace; }
      .terminal-date { fill: #FB94FF; font-family: monospace; }
      .terminal-emoji { font-size: 16px; font-family: monospace; }
      .gradient-text { fill: url(#sopGradient); font-weight: bold; font-family: monospace; }
      .dim-text { fill: #7F7F9F; font-family: monospace; }
      .ascii-art { fill: url(#sopGradient); font-family: monospace; font-size: 13px; font-weight: bold; letter-spacing: 0px; }
    </style>
  </defs>
  
  <!-- Terminal Background -->
  <rect class="terminal-bg" width="800" height="500" rx="10"/>
  
  <!-- Terminal Header -->
  <circle cx="20" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="20" r="6" fill="#27C93F"/>
  
  <!-- ASCII Art Header -->
  <text class="ascii-art" x="50" y="75">█▀▄ ▄▀█ ▀█▀ █▀▀   █▀▄▀█ ▄▀█ ▀█▀ █░█</text>
  <text class="ascii-art" x="50" y="95">█▄▀ █▀█ ░█░ ██▄   █░▀░█ █▀█ ░█░ █▀█</text>
  
  <text class="dim-text" x="50" y="120">────────────────────────────────────────</text>
  <text class="gradient-text" x="50" y="140">datemath-cli</text>
  <text class="dim-text" x="180" y="140">v1.1.0 - Date calculations in natural language</text>
  <text class="dim-text" x="50" y="155">────────────────────────────────────────</text>
  
  <!-- Command 1: between -->
  <text class="terminal-prompt" x="50" y="185">$</text>
  <text class="terminal-text" x="70" y="185">datemath between 2025-01-01 2025-10-17</text>
  
  <text class="terminal-emoji" x="50" y="210">📊</text>
  <text class="terminal-output" x="75" y="210">Time between Wednesday, January 1, 2025 and Friday, October 17, 2025:</text>
  <text class="gradient-text" x="75" y="230" font-size="18px">289 days</text>
  
  <!-- Command 2: add -->
  <text class="terminal-prompt" x="50" y="265">$</text>
  <text class="terminal-text" x="70" y="265">datemath add 2025-10-17 30 days</text>
  
  <text class="terminal-emoji" x="50" y="290">📊</text>
  <text class="terminal-output" x="75" y="290">Friday, October 17, 2025 + 30 days:</text>
  <text class="gradient-text" x="75" y="310" font-size="16px">Saturday, November 16, 2025</text>
  <text class="dim-text" x="75" y="330">ISO format: 2025-11-16</text>
  
  <!-- Command 3: to -->
  <text class="terminal-prompt" x="50" y="365">$</text>
  <text class="terminal-text" x="70" y="365">datemath to 2026-01-01</text>
  
  <text class="terminal-emoji" x="50" y="390">📊</text>
  <text class="terminal-output" x="75" y="390">Time until Thursday, January 1, 2026:</text>
  <text class="gradient-text" x="75" y="410" font-size="18px">75 days</text>
  
  <!-- Cursor -->
  <text class="terminal-prompt" x="50" y="445">$</text>
  <rect x="70" y="433" width="10" height="16" fill="#B362FF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Footer -->
  <text class="dim-text" x="50" y="475" font-size="12px">Made with 💜 by Ahmad Awais</text>
</svg>
